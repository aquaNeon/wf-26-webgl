<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slider — Webflow markup</title>
<style>
  /* Stand-in for the Webflow project styles. The module supplies its own
     layout CSS for [data-webgl-canvas]; this file only provides the look
     of the parts Webflow owns — heading, tag block, typography. */
  :root { --page-bg:#f7f6f3; --ink:#101010; --ink-soft:#6b6a66; --hair:#dedcd6; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--page-bg); color: var(--ink);
    font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* page content either side, so the section genuinely scrolls past */
  .filler { height: 100svh; display: grid; place-items: center; color: var(--ink-soft); font-size: 13px; }
  /* Heading sits in normal flow, canvas absolutely fills the section —
     the layout the real site uses. */
  .webgl_slider_wrap {
    position: relative; height: 100svh; overflow: hidden;
    /* on the WRAP, not the canvas, so the heading can measure against it too */
    --mw-card-w: clamp(240px, 26cqw, 620px);
    container-type: inline-size;
  }

  /* The heading sits at the top of the section and stays there. Opening a
     card fades it out (the module drives its opacity), which is all small
     screens need — no anchoring it to the row. */
  .webgl_slider_contain {
    position: absolute; left: 0; right: 0; top: var(--mw-head-top, 2rem);
    z-index: 20; pointer-events: none;
  }

  .webgl_slider_heading_center { text-align: center; }
  .heading-component h1 { margin: 0; font-size: clamp(32px,7vw,96px); letter-spacing: -.045em; font-weight: 700; }

  .webgl_canvas {
    --mw-backdrop: var(--page-bg);   /* omit this and the row stays visible */
    position: absolute; inset: 0;      /* must beat the module's default */
  }

  /* The tag block: authored in Webflow, lifted into a screen-space layer
     by the module so it never inherits the card's skew. Position it however
     you like — the layer is exactly the open card's rect, so `absolute`
     here resolves against the image. */
  .webgl_cards_tag {
    position: absolute; right: 24px; bottom: 24px;   /* tag: bottom-right */
    display: flex; align-items: center; gap: 11px;
    padding: 9px 14px 9px 9px; background: var(--page-bg);
    border: 1px solid var(--hair); border-radius: 5px;
    box-shadow: 0 6px 22px rgba(16,16,16,.10);
  }
  /* data-icon-bg / data-icon-color on a card arrive here as custom
     properties. The fill rule beats the SVG own fill= attribute, which is a
     presentation attribute and loses to any stylesheet. */
  .webgl_cards_svg_wrap { width: 30px; height: 30px; border-radius: 3px; display: grid; place-items: center; flex: none;
    background: var(--mw-icon-bg, #146ef5); }
  .webgl_cards_svg_icon svg { width: 15px; height: 15px; display: block; }
  .webgl_cards_svg_icon svg path { fill: var(--mw-icon-color, #fff); }
  /* deliberately written as DESCENDANT selectors, the way Webflow emits
     nested styles — these must survive the tag being lifted out of the card */
  .webgl_card_inner_wrap .webgl_cards_poject { font-size: 13px; font-weight: 600; letter-spacing: -.01em; color: var(--ink); }
  .webgl_card_inner_wrap .webgl_cards_name_by { display: flex; gap: 4px; font-size: 12px; color: var(--ink-soft); }
  .webgl_card_inner_wrap a.webgl_cards_studio { color: var(--ink-soft); text-decoration: underline; text-underline-offset: 2px; }

  /* Authored inside the component, so there is one per card. The module
     lifts it onto the open card and fades it with the tag. */
  /* No data-webgl-pin value, so the module writes nothing here and these
     offsets resolve against the open card exactly as authored. */
  .webgl_close {
    position: absolute; top: 24px; right: 24px; z-index: 800;
    width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid var(--hair); background: #fff; color: var(--ink);
    display: grid; place-items: center; cursor: pointer;
    transition: transform .3s ease;
  }
  /* a white card background, to prove it never shows behind the flying card */
  .webgl_card_inner_wrap { background: #fff; width: 100%; height: 100%; position: relative; }
  .webgl_close:hover { transform: rotate(90deg); }
  .webgl_close svg { width: 16px; height: 16px; }
</style>
</head>
<body>

<div class="filler">content above — scroll down</div>

<section class="webgl_slider_wrap">
  <div class="webgl_slider_contain">
    <div class="webgl_slider_heading_center" data-webgl-heading>
      <div data-wf--heading--alignment="left-align" class="heading-component"><h1>#MadeinWebflow</h1></div>
    </div>
  </div>

  <div data-webgl-canvas class="webgl_canvas"
       data-fit="cover"
       data-anchor="top"
       data-hole-x="0.028472" data-hole-y="0.047004"
       data-hole-w="0.804861" data-hole-h="0.905993"
       data-scroll-span="-3">
    <!-- CARDS: filled by a script below so this file stays readable.
         Each is exactly the Webflow component markup. -->
  </div>
</section>

<div class="filler">content below — the section scrolls past normally</div>

<script>
/* Build 8 copies of the Webflow component. In the real site these come
   from the component / CMS; the only thing that matters here is that the
   attributes and nesting match. */
(() => {
  const ICON = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15.6517 12.745C14.8468 12.745 14.1462 13.0431 13.5499 13.6393C12.9835 14.2058 12.7002 14.8915 12.7002 15.6964V22.762C12.7002 22.9112 12.6406 23.0304 12.5214 23.1198C12.4319 23.2092 12.3276 23.254 12.2083 23.254H10.9115C10.7624 23.254 10.6432 23.2092 10.5537 23.1198C10.4643 23.0304 10.4196 22.9112 10.4196 22.762V15.6964C10.4196 14.8915 10.1214 14.2058 9.52518 13.6393C8.95874 13.0431 8.27304 12.745 7.4681 12.745H0.49191C0.342846 12.745 0.223596 12.7002 0.134157 12.6108C0.0447192 12.5214 0 12.4021 0 12.253V11.0456C0 10.9264 0.0447192 10.822 0.134157 10.7326C0.223596 10.6133 0.342846 10.5537 0.49191 10.5537H7.4681C8.27304 10.5537 8.95874 10.2705 9.52518 9.70406C10.1214 9.13762 10.4196 8.43702 10.4196 7.60226V0.49191C10.4196 0.342846 10.4643 0.223596 10.5537 0.134158C10.6432 0.0447194 10.7624 0 10.9115 0H12.2083C12.3574 0 12.4766 0.0447194 12.5661 0.134158C12.6555 0.223596 12.7002 0.342846 12.7002 0.49191V7.60226C12.7002 8.4072 12.9835 9.1078 13.5499 9.70406C14.1462 10.2705 14.8468 10.5537 15.6517 10.5537H22.5832C22.7322 10.5537 22.8514 10.6133 22.941 10.7326C23.0602 10.822 23.1198 10.9264 23.1198 11.0456V12.253C23.1198 12.4021 23.0602 12.5214 22.941 12.6108C22.8514 12.7002 22.7322 12.745 22.5832 12.745H15.6517Z" fill="white"/></svg>';

  // NOTE: data-webgl-image is the ARTWORK, data-webgl-overlay is the UI.
  // In the markup pasted from Webflow these two srcs are swapped.
  const ART = '/slide-trevor-noah.png';
  const UI  = '/ui-chrome.png';

  // third entry is optional: [iconBg, iconColor], set per card in Webflow as
  // data-icon-bg / data-icon-color. Omit it and the stylesheet default stands.
  const NAMES = [
    ['Trevor Noah', 'Off-brand', ['#f04a23', '#ffffff']],
    ['Clay', 'N4', ['#2f6b4f', '#e8ffe8']],
    ['Radiant', 'N4'],
    ['Claude', 'Off-brand'], ['Greenhouse', 'N4'], ['Fauna Robotics', 'N4'],
    ['Aggregate', 'Made You Look'], ['Northbound', 'N4'],
  ];

  const canvas = document.querySelector('[data-webgl-canvas]');
  canvas.innerHTML = NAMES.map(([project, studio, icon]) => `
    <div data-webgl-item class="webgl_cards_wrap"${icon ? ` data-icon-bg="${icon[0]}" data-icon-color="${icon[1]}"` : ''}>
      <div class="webgl_card_inner_wrap">
        <img data-webgl-overlay alt="" src="${UI}" loading="eager" class="webgl_card_ui_overlay">
        <img data-webgl-image alt="" src="${ART}" loading="eager" class="webgl_card_inner_img">
        <button type="button" data-webgl-close class="webgl_close" aria-label="Close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 2 L14 14 M14 2 L2 14"/></svg>
        </button>
        <div class="webgl_cards_tag">
          <div class="webgl_cards_svg_wrap"><div class="webgl_cards_svg_icon w-embed">${ICON}</div></div>
          <div class="webgl_cards_name_wrap">
            <div class="webgl_cards_poject">${project}</div>
            <div class="webgl_cards_name_by paragraph-s">
              <div class="webgl_cards_studio">by</div>
              <a href="#" class="webgl_cards_studio">${studio}</a>
            </div>
          </div>
        </div>
      </div>
    </div>`).join('');
})();
</script>

<script type="module" src="/src/main.js"></script>

</body>
</html>
